name: Atualizar dados do dashboard

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (minimo permitido pelo GitHub Actions)
  workflow_dispatch: {}       # permite disparar manualmente pela aba Actions
  push:
    branches: [main]
    paths-ignore:
      - "data/master_data.json"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Buscar dados do Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_sheet_data.py

      - name: Commitar dados atualizados (se houve mudanca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/master_data.json
          git diff --cached --quiet || git commit -m "chore: atualizar dados do dashboard [skip ci]"
          git push
